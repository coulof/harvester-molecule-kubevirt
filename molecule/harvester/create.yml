---
- name: Create
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    temporary_ssh_key_size: 2048
  tasks:
    - name: Set default SSH key path
      ansible.builtin.set_fact:
        temporary_ssh_key_path: "{{ molecule_ephemeral_directory }}/identity_file"

    - name: Generate SSH key pair
      community.crypto.openssh_keypair:
        path: "{{ temporary_ssh_key_path }}"
        size: "{{ temporary_ssh_key_size }}"
      register: temporary_ssh_keypair

    - name: Set SSH public key
      ansible.builtin.set_fact:
        temporary_ssh_public_key: "{{ temporary_ssh_keypair.public_key }}"

    - name: Ensure target namespaces exist
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ molecule_yml.platforms | map(attribute='namespace') | unique | list }}"

    - name: Create VM in Harvester (KubeVirt)
      ansible.builtin.include_tasks: tasks/create_vm.yml
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    # Deviation from upstream: the `when` is on the task, not on a block that
    # references a loop variable leaked from a previous include_tasks loop.
    - name: Create ssh NodePort Services
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ vm.name }}"
            namespace: "{{ vm.namespace }}"
            labels:
              app.kubernetes.io/managed-by: molecule
          spec:
            ports:
              - name: ssh
                port: 22
                protocol: TCP
                targetPort: 22
            selector:
              kubevirt.io/domain: "{{ vm.name }}"
            type: NodePort
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
      when: vm.ssh_service.type | default('') == 'NodePort'

    - name: Retrieve Service info
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: "{{ vm.name }}"
        namespace: "{{ vm.namespace }}"
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"
      when: vm.ssh_service.type | default('') == 'NodePort'
      register: node_port_services

    - name: Create VM dictionary
      ansible.builtin.include_tasks: tasks/create_vm_dictionary.yml
      loop: "{{ molecule_yml.platforms }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.name }}"

    - name: Create ansible inventory from dictionary
      vars:
        molecule_inventory:
          all:
            children:
              molecule:
                hosts: "{{ molecule_systems }}"
      ansible.builtin.copy:
        content: "{{ molecule_inventory | to_nice_yaml }}"
        dest: "{{ molecule_ephemeral_directory }}/inventory/molecule_inventory.yml"
        mode: "0600"

    - name: Refresh inventory
      ansible.builtin.meta: refresh_inventory

    - name: Assert molecule group exists
      ansible.builtin.assert:
        that: "'molecule' in groups"
        fail_msg: "Molecule group was not found in inventory groups: {{ groups }}"
      run_once: true # noqa: run-once

- name: Validate that inventory was refreshed
  hosts: molecule
  gather_facts: false
  tasks:
    - name: Wait for the host to be reachable
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
